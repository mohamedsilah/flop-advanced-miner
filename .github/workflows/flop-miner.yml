name: Run Advanced FLOP Miner (Script 2 Optimization)

on:
  push:
    branches: [ main ]
  schedule:
    # الجدولة الزمنية البشرية المتباعدة والعشوائية لحسابك 1mmb78
    - cron: '23 2,6,11,15,18,22 * * *'
  workflow_dispatch: 

jobs:
  run-advanced-miner:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Modern Node.js Environment
      uses: actions/setup-node@v4
      with:
        # تم التحديث إلى نسخة Node.js 24 المستقرة والأحدث لحل التحذير نهائياً
        node-version: '24'

    - name: Install Project Dependencies
      run: |
        npm install

    - name: Execute Production Node V5
      env:
        TECHNOCORE_URL: "https://technocore.chat"
        MY_SECRET_SEED: ${{ secrets.TECHNOCORE_SIGNING_KEY }}
      run: |
        npm start
